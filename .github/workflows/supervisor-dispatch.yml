# Deterministic dispatcher for the protected hosted supervisor.
# The post-transfer scheduler workflow (`sentinel-scheduler.yml`) invokes this
# dispatcher on its cron fallback, and every completed supervisor run invokes
# it directly through `workflow_run`. The event chain keeps work moving when
# GitHub's cron scheduler is delayed, without an external host.
#
# Scheduled runs execute from the default branch, so they dispatch the fixed
# supervisor workflow explicitly at its protected source ref. Before that
# dispatch, one bounded recovery pass (src/host/supervisor-dispatch.ts) may
# force-cancel at most one stale owner of the run-level `sentinel-supervisor`
# group: a `queued`/`in_progress` run of the exact `supervisor.yml` workflow on
# exactly the `sentinel-supervisor` ref with no active job or runner, no
# protected pending deployment, and no useful transition for at least 30
# minutes. Without that pass one wedged run turns every five-minute dispatch
# into a pending successor forever (observed 2026-10-01, run 36862385999:
# `finalize` queued with no runner held the group for ~20 hours; normal
# cancellation left the `always()` finalizer queued). Any incomplete, malformed
# or failed read fails closed and never authorizes a cancellation, and the
# ordinary fixed-ref dispatch still runs. This job has no App key and cannot
# read the supervisor environment secret.
name: sentinel-supervisor-dispatch

on:
  schedule:
    - cron: "*/5 * * * *"
  # Completion-triggered dispatch is a fallback only. GitHub stops a
  # workflow_run chain after three levels; the supervisor's finalize job sends
  # the durable workflow_dispatch handoff below instead.
  workflow_run:
    workflows: ["sentinel-supervisor"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sentinel_parent_run_id:
        description: Completed supervisor run that requested this handoff
        required: false
        type: string
        default: ""

permissions:
  # actions: write covers both the fixed-ref dispatch and the bounded
  # force-cancel; contents: write permits the expected-head launcher advance.
  actions: write
  contents: write

concurrency:
  group: sentinel-supervisor-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'sentinel-supervisor' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the completed parent supervisor
        if: github.event_name == 'workflow_dispatch' && inputs.sentinel_parent_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PARENT_RUN_ID: ${{ inputs.sentinel_parent_run_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 240))
          while (( SECONDS < deadline )); do
            status=$(gh run view "$PARENT_RUN_ID" --repo "$GH_REPO" --json status --jq .status)
            if [ "$status" = completed ]; then
              exit 0
            fi
            sleep 10
          done
          echo "parent supervisor did not complete within 4 minutes" >&2
          exit 1
      - name: Check out the dispatcher source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Follow the newest CI-green development ancestor
        id: follow
        uses: ./.github/actions/hosted-runtime-control
        with:
          token: ${{ github.token }}
          auto-follow: ${{ vars.SENTINEL_AUTO_FOLLOW || 'on' }}
      - name: Recover one bounded stale run, then dispatch the exact protected ref
        env:
          GH_TOKEN: ${{ github.token }}
          SENTINEL_FOLLOW_SHA: ${{ steps.follow.outputs.launcher-sha }}
          SENTINEL_FOLLOW_READY: ${{ steps.follow.outputs.follow-ready }}
        run: >-
          deno run
          --allow-net=api.github.com
          --allow-env=GH_TOKEN,SENTINEL_FOLLOW_SHA,SENTINEL_FOLLOW_READY
          src/host/supervisor-dispatch.ts
      # Backup CI (docs/backup-ci-spec.md §8.4): one trusted pass per
      # five-minute dispatch, only while the mode is shadow or on (unset is
      # on; `off` disables it). Its failure never fails the supervisor
      # dispatch.
      - name: Dispatch the backup CI pass
        if: contains(fromJSON('["shadow","on"]'), vars.SENTINEL_BACKUP_CI || 'on')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run backup-ci.yml --ref sentinel-supervisor
