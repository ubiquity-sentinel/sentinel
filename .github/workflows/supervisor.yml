# Fixed hosted Sentinel supervisor.
#
# Dispatched at the immutable protected source ref by supervisor-dispatch.yml
# (five-minute cadence) and by repair.yml (hourly/manual). prepare, maintenance,
# repair and finalize run under the sentinel-supervisor environment, which alone
# may read the App private key. Every one of them mints a fresh scoped
# installation token so that the code changes Sentinel makes (branch pushes,
# pull requests, merges, reviews, issue writes) are authenticated as
# `ubiquity-sentinel[bot]`; state-ref bookkeeping stays on the native Actions
# token. The repair job starts no model for verification executions.
name: sentinel-supervisor
run-name: ${{ inputs.sentinel_dispatch_request && format('sentinel-supervisor request {0}', inputs.sentinel_dispatch_request) || '' }}

on:
  workflow_dispatch:
    inputs:
      sentinel_dispatch_request:
        description: Internal operator dispatch identity
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

# DEVELOPMENT SWITCH: the durable GitHub cooldown gates are disabled while the
# lane is under development, so cooldown bookkeeping can never freeze a run.
# Remove this block (or set the value to `enforce`) to restore enforcement.
env:
  SENTINEL_COOLDOWN_MODE: off
  # Lower-only admission switch; accepted proof policy remains pinned in source.
  SENTINEL_MERGE_QUEUE: ${{ vars.SENTINEL_MERGE_QUEUE }}

concurrency:
  group: sentinel-supervisor
  cancel-in-progress: false

jobs:

  # One-shot issue-48 review-quota recovery. It holds the existing
  # sentinel-repair lock (the same group the repair job uses) and runs before
  # prepare under the protected ref, so no scheduled legacy run can race it; it
  # never installs or starts a model and uses only the repository github.token.
  maintenance:
    outputs:
      queueCustodyReady: ${{ steps.autonomy.outputs.queueCustodyReady }}
      runtimeMigrationOnly: ${{ steps.autonomy.outputs.runtimeMigrationOnly }}
      runtimeMigrationRevision: ${{ steps.autonomy.outputs.runtimeMigrationRevision }}
      runtimeMigrationGeneration: ${{ steps.autonomy.outputs.runtimeMigrationGeneration }}
    # The scoped generation-68 verification settled healthy, so the maintenance
    # writer is restored to its protected-ref condition; it performs bounded
    # self-upkeep (retries and reviewed-head delivery) before prepare.
    if: github.ref == 'refs/heads/sentinel-supervisor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `issues: write` is what the autonomy pass needs to close an issue once its
    # exact reviewed head has an ACCEPTED hosted release, and `actions: write`
    # is what it needs to approve the credential-free deterministic check that
    # GitHub parks for a bot-authored pull request.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      issues: write
      actions: write
    environment:
      name: sentinel-supervisor
    concurrency:
      group: sentinel-repair
      cancel-in-progress: false
    steps:
      - name: Checkout protected supervisor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          # Full history so the helper can bind the actual checked-out HEAD to
          # the dispatched GITHUB_SHA.
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Bounded self-upkeep, run before prepare under the repair lock so its
      # state changes are visible to this run's own execution:
      #   1. a record blocked by a TRANSIENT model-run failure is retried with
      #      the smallest closed counter grant that makes its next admission an
      #      unused reservation identity below the runtime's own attempt
      #      ceiling (or with the runtime's base-refresh intent when every
      #      identity at the current base is charged), at most
      #      HOSTED_AUTONOMY_MAX_RETRIES (200) grants per task, counted in the
      #      task's durable reservations (every purpose, including one still
      #      reserved); the preserved `retries` counter is history and is never
      #      incremented or reset;
      #   2. a record whose exact reviewed head carries a completed receipt with
      #      no unresolved P0/P1 and a successful deterministic check is
      #      delivered end to end: the expected-head merge is performed with a
      #      compare-and-swap (the runtime's own merge port refuses while this
      #      deployment's `development` ruleset carries no active
      #      `pull_request` rule, which the owner removed and ordered not to
      #      restore) and the exact release request the runtime's delivery step
      #      would have written is recorded for the trusted supervisor, which
      #      still owns proofs, promotion, acceptance and rollback. It writes
      #      no review, receipt, proof or acceptance, is idempotent, and exits
      #      zero on every non-applied outcome.
      - name: Resolve the committed target repositories
        id: targets
        run: |
          set -euo pipefail
          repositories=$(jq -r --arg self 'ubiquity-sentinel/sentinel' 'map(select(. != $self)) | join(",")' sentinel.targets.json)
          if [ -z "$repositories" ]; then
            echo "sentinel.targets.json names no foreign repository" >&2
            exit 1
          fi
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
      # This mint passes no `permission-*` input on purpose: the token inherits
      # the whole installation grant (contents, pull requests, issues, actions,
      # checks, statuses) so every code change this pass writes is
      # authenticated as `ubiquity-sentinel[bot]`.
      - name: Mint the scoped sentinel App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          repositories: ${{ steps.targets.outputs.repositories }}
      - name: Mint the scoped self installation token
        id: self-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity-sentinel
          repositories: sentinel
      - name: Run hosted autonomy (retry transient failures, deliver reviewed heads)
        id: autonomy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
          SENTINEL_SELF_TOKEN: ${{ steps.self-token.outputs.token }}
          SENTINEL_SELF_TOKEN_MINT_GRANT: ${{ steps.self-token.outputs.mint-grant }}
          # The non-secret model-route selector only (never a key and never a
          # failover override): a changed route re-arms the records the
          # repeat-failure bound parked for the owner.
          SENTINEL_MODEL_BASE_URL: ${{ vars.SENTINEL_MODEL_BASE_URL }}
          SENTINEL_MODEL_ID: ${{ vars.SENTINEL_IMPLEMENTATION_MODEL_ID || 'gpt-6.1-sol' }}
          SENTINEL_MODEL_FALLBACK: ${{ vars.SENTINEL_MODEL_FALLBACK }}
          SENTINEL_BACKUP_CI: ${{ vars.SENTINEL_BACKUP_CI }}
        run: >-
          deno run --no-lock
          --allow-read
          --allow-write
          --allow-run
          --allow-net="api.github.com,*.blob.core.windows.net"
          --allow-env=GITHUB_OUTPUT,GITHUB_STEP_SUMMARY,HOME,PATH,NODE_V8_COVERAGE,GITHUB_TOKEN,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_WORKFLOW_REF,GITHUB_JOB,SENTINEL_SUPERVISOR_TOKEN,SENTINEL_SELF_TOKEN,SENTINEL_SELF_TOKEN_MINT_GRANT,SENTINEL_COOLDOWN_MODE,SENTINEL_MERGE_QUEUE,SENTINEL_BACKUP_CI,SENTINEL_MODEL_BASE_URL,SENTINEL_MODEL_ID,SENTINEL_MODEL_FALLBACK
          ops/hosted-autonomy.ts

  prepare:
    needs: maintenance
    if: always() && needs.maintenance.result == 'success' && github.ref == 'refs/heads/sentinel-supervisor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Prepare verifies the exact launcher's ancestry and successful test-local
    # check before journaling a self-install through the release-state CAS.
    permissions:
      contents: read
      actions: read
      checks: read
    environment:
      name: sentinel-supervisor
    outputs:
      run: ${{ steps.prepare.outputs.run }}
      revision: ${{ steps.prepare.outputs.revision }}
      modelStartsEnabled: ${{ steps.prepare.outputs.modelStartsEnabled }}
      executionPurpose: ${{ steps.prepare.outputs.executionPurpose }}
      generation: ${{ steps.prepare.outputs.generation }}
    steps:
      - name: Checkout protected supervisor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # The App installation token is scoped to exactly the FOREIGN repositories
      # the committed target setting names; the self target uses github.token.
      # The array is the single source of truth, so a target can never be
      # repaired under a token that does not include it, and an empty foreign
      # setting fails here instead of minting a pointlessly narrow token.
      - name: Resolve the committed target repositories
        id: targets
        run: |
          set -euo pipefail
          repositories=$(jq -r --arg self 'ubiquity-sentinel/sentinel' 'map(select(. != $self)) | join(",")' sentinel.targets.json)
          if [ -z "$repositories" ]; then
            echo "sentinel.targets.json names no foreign repository" >&2
            exit 1
          fi
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
      - name: Mint the scoped supervisor installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: write
      - name: Mint the scoped self installation token
        id: self-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity-sentinel
          repositories: sentinel
      - name: Prepare hosted supervisor run
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
          SENTINEL_SELF_TOKEN: ${{ steps.self-token.outputs.token }}
          SENTINEL_SELF_TOKEN_MINT_GRANT: ${{ steps.self-token.outputs.mint-grant }}
        run: deno task supervisor:run

  matrix_plan:
    name: matrix_plan
    needs: [maintenance, prepare]
    if: ${{ !cancelled() && needs.maintenance.result == 'success' && needs.prepare.result == 'success' && github.ref == 'refs/heads/sentinel-supervisor' && needs.prepare.outputs.run == 'true' && needs.prepare.outputs.modelStartsEnabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: sentinel-supervisor
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    outputs:
      matrix: ${{ steps.matrix_plan.outputs.matrix }}
      planDigest: ${{ steps.matrix_plan.outputs.planDigest }}
      hasCells: ${{ steps.matrix_plan.outputs.hasCells }}
      planArtifactDigest: ${{ steps.plan_artifact.outputs.artifact-digest }}
    concurrency:
      group: sentinel-repair
      cancel-in-progress: false
    steps:
      - name: Checkout protected launcher source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: launcher
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout selected runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: runtime
          # Full history: a depth-1 checkout keeps a shallow boundary through
          # the local copy and makes the base-refresh merge see no ancestor.
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Expose the pinned Node to the model sandbox
        run: |
          set -euo pipefail
          sudo install -m755 "$(command -v node)" /usr/local/bin/node
          test "$(/usr/local/bin/node --version)" = "v24.19.0"
      - name: Install locked self-test dependencies
        working-directory: launcher
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix .github/actions/sentinel-app-token
      - name: Seal trusted self-test dependencies
        working-directory: launcher
        run: >-
          deno run --no-lock
          --allow-read --allow-write --allow-run
          --allow-env=PATH,NODE_V8_COVERAGE
          ops/hosted-autonomy-self-dependencies.ts
      - name: Install pinned Codex app-server
        run: npm install --global @openai/codex@0.154.0
      # GitHub-hosted Linux runners need unprivileged user namespaces for
      # bubblewrap; same handling as openai/codex-action action.yml 289-315:
      # https://github.com/openai/codex-action/blob/main/action.yml
      # Ephemeral runner only; no model profile or host setting changes.
      - name: Enable Linux user namespaces for bubblewrap
        continue-on-error: true
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Resolve the committed target repositories
        id: targets
        working-directory: launcher
        run: |
          set -euo pipefail
          repositories=$(jq -r --arg self 'ubiquity-sentinel/sentinel' 'map(select(. != $self)) | join(",")' sentinel.targets.json)
          if [ -z "$repositories" ]; then
            echo "sentinel.targets.json names no foreign repository" >&2
            exit 1
          fi
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
      - name: Record the App token mint lower bound
        id: token-window
        run: echo "mintedNotBefore=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Mint the scoped sentinel App token
        id: app-token
        uses: ./launcher/.github/actions/sentinel-app-token
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          repositories: ${{ steps.targets.outputs.repositories }}
      - name: Mint the scoped self installation token
        id: self-token
        uses: ./launcher/.github/actions/sentinel-app-token
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity-sentinel
          repositories: sentinel
      - name: Plan isolated issue matrix
        id: matrix_plan
        working-directory: launcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
          SENTINEL_SELF_TOKEN: ${{ steps.self-token.outputs.token }}
          SENTINEL_SELF_TOKEN_MINT_GRANT: ${{ steps.self-token.outputs.mint-grant }}
          SENTINEL_TARGET_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          SENTINEL_SELF_INSTALLATION_ID: ${{ steps.self-token.outputs.installation-id }}
          SENTINEL_SUPERVISOR_TOKEN_MINTED_NOT_BEFORE: ${{ steps.token-window.outputs.mintedNotBefore }}
          SENTINEL_SUPERVISOR_TOKEN_MINT_GRANT: ${{ steps.app-token.outputs.mint-grant }}
          UOS_AI_TOKEN: ${{ secrets.UOS_AI_TOKEN }}
          # Installation scope of the `ubiquity-sentinel` App. A scope key, not
          # a secret: every committed target except the sentinel self-repository
          # is repaired under this one App installation, while the sentinel
          # self-target keeps the reserved no-App scope 0.
          SENTINEL_APP_INSTALLATION_ID: "155687488"
          # Model route. Repository/environment vars supply the primary and
          # fallback route; the DeepSeek key is the documented once-per-run
          # fallback credential. Blank optional vars stay blank and the
          # launcher forwards only nonempty values, so an unset var keeps the
          # existing resolver behavior. The implementation model defaults to
          # the owner-chosen gateway model `gpt-6.1-sol` (2026-10-17); a
          # nonempty SENTINEL_IMPLEMENTATION_MODEL_ID var overrides it. The
          # older SENTINEL_MODEL_ID var (it held gpt-reserve) is no longer
          # read. Every job binds the same expression, so a plan and its
          # cells always name one model.
          # The App private key is never bound here.
          SENTINEL_MODEL_BASE_URL: ${{ vars.SENTINEL_MODEL_BASE_URL }}
          SENTINEL_MODEL_ID: ${{ vars.SENTINEL_IMPLEMENTATION_MODEL_ID || 'gpt-6.1-sol' }}
          SENTINEL_REVIEW_MODEL_ID: ${{ vars.SENTINEL_REVIEW_MODEL_ID }}
          SENTINEL_MODEL_FALLBACK: ${{ vars.SENTINEL_MODEL_FALLBACK }}
          SENTINEL_DEEPSEEK_API_KEY: ${{ secrets.SENTINEL_DEEPSEEK_API_KEY }}
          SENTINEL_BACKUP_CI: ${{ vars.SENTINEL_BACKUP_CI }}
        run: >-
          deno run
          --allow-read
          --allow-write
          --allow-run
          --allow-net="api.github.com,*.blob.core.windows.net"
          --allow-env=GITHUB_OUTPUT,HOME,PATH,GITHUB_TOKEN,SENTINEL_SUPERVISOR_TOKEN,SENTINEL_SELF_TOKEN,SENTINEL_SELF_TOKEN_MINT_GRANT,SENTINEL_TARGET_INSTALLATION_ID,SENTINEL_SELF_INSTALLATION_ID,SENTINEL_SUPERVISOR_TOKEN_MINTED_NOT_BEFORE,SENTINEL_SUPERVISOR_TOKEN_MINT_GRANT,SENTINEL_COOLDOWN_MODE,SENTINEL_MERGE_QUEUE,SENTINEL_BACKUP_CI,SENTINEL_MODEL_BASE_URL,SENTINEL_MODEL_ID,SENTINEL_REVIEW_MODEL_ID,SENTINEL_MODEL_FALLBACK,SENTINEL_DEEPSEEK_API_KEY,SENTINEL_APP_INSTALLATION_ID,UOS_AI_TOKEN,NODE_V8_COVERAGE,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_WORKFLOW_REF,GITHUB_JOB
          src/host/hosted-runtime.ts

      - name: Upload immutable matrix plan
        id: plan_artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-matrix-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sentinel-matrix/plan.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  matrix_cell:
    name: matrix_cell (${{ matrix.cellId }})
    needs: [maintenance, prepare, matrix_plan]
    if: ${{ !cancelled() && needs.maintenance.result == 'success' && needs.prepare.result == 'success' && github.ref == 'refs/heads/sentinel-supervisor' && needs.prepare.outputs.run == 'true' && needs.matrix_plan.result == 'success' && needs.matrix_plan.outputs.hasCells == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: sentinel-supervisor
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix_plan.outputs.matrix) }}
    outputs:
      cellArtifactDigest: ${{ steps.cell_artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout protected launcher source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: launcher
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout selected runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: runtime
          # Full history: a depth-1 checkout keeps a shallow boundary through
          # the local copy and makes the base-refresh merge see no ancestor.
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      # ubiquity/ai.ubq.fi runs only on Bun (since d28cefa); its quality
      # wrappers refuse anything but Bun 1.4.0. Same pinned action and version
      # as the deterministic CI gate in ci.yml.
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
          no-cache: true
      # The Codex permission profile lets model commands read only the
      # `:minimal` platform paths plus exact grants (the Codex and Deno
      # executables and, in a runtime whose src/host/local-client.ts carries
      # `SANDBOX_BUN_EXECUTABLE`, /usr/local/bin/bun itself), so the
      # runner-home Bun that setup-bun puts on PATH is invisible inside
      # bubblewrap. A real executable copy at that platform path is what the
      # sandboxed shell finds; same copy as ci.yml.
      - name: Expose the pinned Bun to the model sandbox
        run: |
          set -euo pipefail
          sudo install -m755 "$(command -v bun)" /usr/local/bin/bun
          test "$(/usr/local/bin/bun --version)" = "1.4.0"
      - name: Expose the pinned Node to the model sandbox
        run: |
          set -euo pipefail
          sudo install -m755 "$(command -v node)" /usr/local/bin/node
          test "$(/usr/local/bin/node --version)" = "v24.19.0"
      - name: Install locked self-test dependencies
        working-directory: launcher
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix .github/actions/sentinel-app-token
      - name: Seal trusted self-test dependencies
        working-directory: launcher
        run: >-
          deno run --no-lock
          --allow-read --allow-write --allow-run
          --allow-env=PATH,NODE_V8_COVERAGE
          ops/hosted-autonomy-self-dependencies.ts
      - name: Install pinned Codex app-server
        run: npm install --global @openai/codex@0.154.0
      # GitHub-hosted Linux runners need unprivileged user namespaces for
      # bubblewrap; same handling as openai/codex-action action.yml 289-315:
      # https://github.com/openai/codex-action/blob/main/action.yml
      # Ephemeral runner only; no model profile or host setting changes.
      - name: Enable Linux user namespaces for bubblewrap
        continue-on-error: true
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Resolve the committed target repositories
        id: targets
        working-directory: launcher
        run: |
          set -euo pipefail
          repositories=$(jq -r --arg self 'ubiquity-sentinel/sentinel' 'map(select(. != $self)) | join(",")' sentinel.targets.json)
          if [ -z "$repositories" ]; then
            echo "sentinel.targets.json names no foreign repository" >&2
            exit 1
          fi
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
      # Up to twenty cells start together, and the model gateway answers a
      # burst of simultaneous session starts with HTTP 429 (live: all 17 cells
      # that reached the model in the same second failed, while cells arriving
      # 30-90 s later succeeded). Spreading starts by matrix position, at most
      # 114 s, costs each cell under two minutes of its five-hour window. It
      # runs before the App token mint so the token keeps its whole hour.
      - name: Stagger the cell's model start
        run: sleep $(( ${{ strategy.job-index }} % 20 * 6 ))
