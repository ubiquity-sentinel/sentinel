      # setting fails here instead of minting a pointlessly narrow token. The protected source lives in the
      # `launcher` checkout, so the committed setting is read from there.
      - name: Resolve the committed target repositories
        id: targets
        working-directory: launcher
        run: |
          set -euo pipefail
          repositories=$(jq -r --arg self 'ubiquity-sentinel/sentinel' 'map(select(. != $self)) | join(",")' sentinel.targets.json)
