        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-checks: read
          # Generation 81: a CI correction cell reads the failing job's steps
          # and signed log for the model's CI failure evidence. Read only; an
          # older runtime ignores it and the newer one degrades without it.
          permission-actions: read
      - name: Mint the scoped self installation token
        id: self-token
        uses: ./launcher/.github/actions/sentinel-app-token
        with:
          client-id: Iv23liHUJNXds9mU3j7Q
          private-key: ${{ secrets.SENTINEL_SUPERVISOR_APP_PRIVATE_KEY }}
          owner: ubiquity-sentinel
          repositories: sentinel
      - name: Download immutable matrix plan
        uses: actions/download-artifact@v4
        with:
          name: sentinel-matrix-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sentinel-matrix
      - name: Run isolated issue cell
        id: matrix_cell
        working-directory: launcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_SUPERVISOR_TOKEN: ${{ steps.app-token.outputs.token }}
          SENTINEL_SELF_TOKEN: ${{ steps.self-token.outputs.token }}
          SENTINEL_SELF_TOKEN_MINT_GRANT: ${{ steps.self-token.outputs.mint-grant }}
          SENTINEL_TARGET_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          SENTINEL_SELF_INSTALLATION_ID: ${{ steps.self-token.outputs.installation-id }}
          UOS_AI_TOKEN: ${{ secrets.UOS_AI_TOKEN }}
          # Installation scope of the `ubiquity-sentinel` App. A scope key, not
          # a secret: every committed target except the sentinel self-repository
          # is repaired under this one App installation, while the sentinel
          # self-target keeps the reserved no-App scope 0.
          SENTINEL_APP_INSTALLATION_ID: "155687488"
          # Model route. Repository/environment vars supply the primary and
          # fallback route; the DeepSeek key is the documented once-per-run
          # fallback credential. Blank optional vars stay blank and the
          # launcher forwards only nonempty values, so an unset var keeps the
          # existing resolver behavior. The implementation model defaults to
          # the owner-chosen gateway model `gpt-6.1-sol` (2026-10-17); a
          # nonempty SENTINEL_IMPLEMENTATION_MODEL_ID var overrides it. The
          # older SENTINEL_MODEL_ID var (it held gpt-reserve) is no longer
          # read. Every job binds the same expression, so a plan and its
          # cells always name one model.
          # The App private key is never bound here.
          SENTINEL_MODEL_BASE_URL: ${{ vars.SENTINEL_MODEL_BASE_URL }}
          SENTINEL_MODEL_ID: ${{ vars.SENTINEL_IMPLEMENTATION_MODEL_ID || 'gpt-6.1-sol' }}
          SENTINEL_REVIEW_MODEL_ID: ${{ vars.SENTINEL_REVIEW_MODEL_ID }}
          SENTINEL_MODEL_FALLBACK: ${{ vars.SENTINEL_MODEL_FALLBACK }}
          SENTINEL_DEEPSEEK_API_KEY: ${{ secrets.SENTINEL_DEEPSEEK_API_KEY }}
          SENTINEL_BACKUP_CI: ${{ vars.SENTINEL_BACKUP_CI }}
        run: |
          printf '%s\n' '{"planDigest":"${{ needs.matrix_plan.outputs.planDigest }}","cellId":"${{ matrix.cellId }}"}' |
          deno run \
          --allow-read \
          --allow-write \
          --allow-run \
          --allow-net="api.github.com,*.blob.core.windows.net" \
          --allow-env=HOME,PATH,GITHUB_TOKEN,SENTINEL_SUPERVISOR_TOKEN,SENTINEL_SELF_TOKEN,SENTINEL_SELF_TOKEN_MINT_GRANT,SENTINEL_TARGET_INSTALLATION_ID,SENTINEL_SELF_INSTALLATION_ID,SENTINEL_COOLDOWN_MODE,SENTINEL_MERGE_QUEUE,SENTINEL_BACKUP_CI,SENTINEL_MODEL_BASE_URL,SENTINEL_MODEL_ID,SENTINEL_REVIEW_MODEL_ID,SENTINEL_MODEL_FALLBACK,SENTINEL_DEEPSEEK_API_KEY,SENTINEL_APP_INSTALLATION_ID,UOS_AI_TOKEN,NODE_V8_COVERAGE,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_WORKFLOW_REF,GITHUB_JOB \
          src/host/hosted-runtime.ts

      - name: Upload settled matrix cell
        id: cell_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-matrix-cell-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.cellId }}
          path: |
            .sentinel-matrix/result.json
            .sentinel-matrix/${{ matrix.cellId }}.bundle
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  repair:
    # Starts with the cells: the progressive consumer polls authenticated
    # completed cell artifacts, ingests each exactly once, and leaves slower or
    # missing producers charged and unresolved. finalize still waits for every
    # cell and this consumer, so no producer is settled before its own job ends.
    needs: [maintenance, prepare, matrix_plan]
    if: ${{ !cancelled() && needs.maintenance.result == 'success' && needs.prepare.result == 'success' && github.ref == 'refs/heads/sentinel-supervisor' && needs.prepare.outputs.run == 'true' && (needs.prepare.outputs.modelStartsEnabled != 'true' || needs.matrix_plan.result == 'success') }}
